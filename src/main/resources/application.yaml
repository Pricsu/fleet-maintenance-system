spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fleetdb}
    username: ${DB_USER:fleetuser}
    password: ${DB_PASSWORD:fleetpass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
app:
  jwt:
    secret: change-this-to-a-long-random-secret-in-production-min-32-chars
    expiration-ms: 86400000